# 只在后继正式派发后写入 public 仓库并手动启动。制品来自同一public仓库的GitHub原生附件。
name: 发布已验官网
on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: 同一public仓库的 GitHub website-only.tgz 附件地址
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: 下载固定网站制品
        env:
          ARTIFACT_URL: ${{ inputs.artifact_url }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, urllib.parse
          url = urllib.parse.urlsplit(os.environ['ARTIFACT_URL'])
          assert url.scheme == 'https' and url.hostname == 'github.com' and not url.username and not url.password and not url.query and not url.fragment
          assert url.path.startswith('/user-attachments/files/') and url.path.endswith('/website-only.tgz')
          PY
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 --max-filesize 268435456 --output website-only.tgz "$ARTIFACT_URL"
      - name: 核对制品并提取唯一网站闭包
        run: python3 scripts/verify-and-extract.py website-only.tgz _site
      - name: 保全固定输入制品
        uses: actions/upload-artifact@v4
        with:
          name: website-input-845d2d40f64a81c8
          path: website-only.tgz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: 追加部署标记与交付清单
        run: python3 scripts/add-delivery-metadata.py _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 7
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布官网
        id: deployment
        uses: actions/deploy-pages@v4
